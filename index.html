<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAWKAR ATARY</title>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: system-ui, sans-serif; margin: 0; padding: 20px; text-align: center; }
        h1 { color: #00e676; margin-bottom: 25px; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; max-width: 1000px; margin: 0 auto; }
        .card { background: #1e1e1e; border-radius: 10px; overflow: hidden; border: 1px solid #333; }
        .card img { width: 100%; height: 220px; object-fit: cover; }
        .card p { padding: 10px; margin: 0; color: #ccc; }
    </style>
</head>
<body>

    <h1>HAWKAR ATARY</h1>

    <div class="gallery">
        <div class="card">
            <img src="https://via.placeholder.com/400x300" alt="Photo 1">
            <p>ناوی وێنەی یەکەم</p>
        </div>
        <div class="card">
            <img src="https://via.placeholder.com/400x300" alt="Photo 2">
            <p>ناوی وێنەی دووەم</p>
        </div>
        <div class="card">
            <img src="https://via.placeholder.com/400x300" alt="Photo 3">
            <p>ناوی وێنەی سێیەم</p>
        </div>
    </div>

</body>
</html>
